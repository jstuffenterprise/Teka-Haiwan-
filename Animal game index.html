<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teka Haiwan & Habitat</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #e0f7fa;
            text-align: center;
            padding: 20px;
        }
        h1 { color: #00796b; }
        .game-container {
            display: flex;
            justify-content: space-around;
            margin-top: 40px;
        }
        .pool, .targets {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 40%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .animal, .habitat {
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            user-select: none;
        }
        .animal {
            background-color: #ffccbc;
            border: 2px dashed #ff5722;
        }
        .habitat {
            background-color: #c8e6c9;
            border: 2px solid #4caf50;
            min-height: 40px;
        }
        #message {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #d32f2f;
        }
    </style>
</head>
<body>

    <h1>🦁 Teka Haiwan & Bunyi 🐵</h1>
    <p>Seret atau padankan haiwan ke habitat yang betul!</p>

    <div class="game-container">
        <!-- Senarai Haiwan -->
        <div class="pool">
            <h3>Haiwan</h3>
            <div class="animal" draggable="true" id="monkey" ondragstart="drag(event)">🐒 Monyet</div>
            <div class="animal" draggable="true" id="fish" ondragstart="drag(event)">🐟 Ikan</div>
        </div>

        <!-- Senarai Habitat -->
        <div class="targets">
            <h3>Habitat</h3>
            <div class="habitat" ondrop="drop(event, 'tree')" ondragover="allowDrop(event)">🌳 Pokok (Hutan)</div>
            <div class="habitat" ondrop="drop(event, 'water')" ondragover="allowDrop(event)">🌊 Air (Laut/Sungai)</div>
        </div>
    </div>

    <div id="message"></div>

    <script>
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drop(ev, habitatType) {
            ev.preventDefault();
            var animalId = ev.dataTransfer.getData("text");
            var message = document.getElementById("message");

            // Semak jawapan betul atau salah
            if ((animalId === 'monkey' && habitatType === 'tree') || 
                (animalId === 'fish' && habitatType === 'water')) {
                message.style.color = "#388e3c";
                message.innerHTML = "🎉 Tahniah! Betul!";
                // Sembunyikan haiwan yang sudah betul
                document.getElementById(animalId).style.display = "none";
            } else {
                message.style.color = "#d32f2f";
                message.innerHTML = "❌ Ops, cuba lagi!";
            }
        }
    </script>

</body>
</html>
